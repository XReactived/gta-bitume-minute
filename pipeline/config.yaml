# ===== Réglages du pipeline (modifiable sans toucher au code) =====

fuseau_horaire: Europe/Paris

# --- Agent Clips ---
clips:
  # Logins Twitch (ce qu'il y a après twitch.tv/). Vérifie-les : le journal
  # affiche "introuvable" pour un login qui n'existe pas.
  streamers:
    - jltomy
    - michou
    - anyme023
    - squeezie
    - itachie        # à vérifier
    # Autres streamers FR qui jouent souvent à GTA (logins à vérifier dans le journal)
    - gotaga
    - inoxtag
    - zerator
    - ponce
    - rivenzi
    - domingo
  # Streamers à ne JAMAIS utiliser (ex. : quelqu'un qui a demandé un retrait)
  exclus: []
  # Ne garder que les clips joués sur GTA VI (sinon tout le contenu des streamers)
  seulement_gta6: true
  # Prendre aussi les meilleurs clips de toute la catégorie GTA VI, par langue,
  # avec le nombre maximum de clips par passage pour chaque langue.
  # en = streamers américains/anglais : sous-titres traduits en français automatiquement.
  langues:
    fr: 7
    en: 3
  # Vues minimum par langue (les clips anglais ont beaucoup plus de vues : on est plus exigeant)
  vues_minimum_par_langue:
    fr: 300
    en: 3000
  fenetre_heures: 48        # ne cherche que les clips des dernières 48 h
  vues_minimum: 300         # un clip doit déjà avoir plu un minimum
  max_par_passage: 10       # clips téléchargés à chaque passage (Claude ne garde ensuite que les meilleurs)
  intervalle_minutes: 60    # fréquence de recherche

# --- Agent Montage ---
montage:
  # Claude choisit lui-même le format (solo, top, série en plusieurs parties)
  # et la durée de chaque vidéo, entre ces deux bornes.
  duree_min_s: 15
  note_min: 7               # Claude note chaque clip sur 10 ; en dessous, il n'est pas utilisé
  duree_max_s: 90           # vidéos courtes et rythmées (Claude vise 60 à 80 s)
  plan_min_clips: 3   # nombre de clips en attente avant de demander un plan à Claude
  # Transcription : large-v3-turbo = bien plus précis que small (un peu plus lent, ~1 min par clip)
  modele_whisper: large-v3-turbo
  confiance_min: 0.45       # en dessous, le mot n'est pas affiché (mieux vaut rien qu'un sous-titre faux)
  sous_titres: true
  # Streamers qui ont déjà leurs propres sous-titres dans le stream : on n'ajoute pas les nôtres
  # (en plus, Claude détecte tout seul les streamers qui ont déjà des sous-titres)
  streamers_sans_sous_titres: [anyme023, leothecrack]
  # Mots mal prononcés par la voix : « comme c'est écrit »: « comme ça se dit »
  prononciation:
    Leo: Léo
  # Format « top » : intro, puis #3, #2, #1 annoncés par une voix-off avant chaque clip
  voix_off: true
  # Moteur de voix : "openai" = voix réaliste (clé OPENAI_API_KEY dans .env, ~1-2 €/mois),
  # "piper" = voix gratuite robotique (utilisée aussi en secours si OpenAI ne répond pas)
  voix_moteur: openai
  voix_openai: ash          # autres voix possibles : onyx, echo, ballad, verse, coral, sage
  voix_modele: fr_FR-siwis-medium   # voix gratuite de secours (Piper)
  credit: true              # "@streamer sur Twitch" affiché en permanence
  camera_en_haut: true      # webcam du streamer en haut, jeu en grand dessous (repérée par Claude)
  cadrage_suivi: true       # le cadre vertical suit le visage ou l'action (opencv)

# --- Agent TikTok ---
tiktok:
  # "brouillon" : la vidéo arrive dans ta boîte TikTok, tu appuies sur Publier.
  # "direct"    : publication 100 % automatique (exige l'audit de ton app TikTok).
  mode: brouillon
  # Tant que l'app n'est pas auditée, TikTok force la visibilité privée.
  visibilite: PUBLIC_TO_EVERYONE
  # Heures de pointe TikTok en France (heure de Paris), 5 vidéos par jour :
  # pause déjeuner, sortie des cours/du travail, soirée (le pic pour le gaming).
  horaires:
    semaine:  ["12:30", "17:30", "19:30", "21:00", "22:30"]
    mercredi: ["12:30", "14:30", "17:30", "19:30", "21:30"]   # après-midi libre pour les collégiens
    weekend:  ["11:00", "14:00", "17:30", "20:00", "22:30"]   # réveil plus tard, soirée plus longue
  hashtags_fixes: ["#gta6", "#gtavi", "#gta"]
  modele_ia: claude-sonnet-5-5      # écrit les plans et les textes
  # modèle qui contrôle chaque clip (règles TikTok) et chaque vidéo finie (qualité) avant l'envoi
  modele_controle: claude-haiku-5-5   # regarde chaque clip et chaque vidéo (très bon marché)

notifications:
  # Notification sur ton téléphone (appli gratuite « ntfy ») à chaque vidéo envoyée, avec la légende.
  actif: true
  serveur: https://ntfy.sh
