# ===== Réglages du pipeline (modifiable sans toucher au code) =====

fuseau_horaire: Europe/Paris

# --- Agent Clips ---
clips:
  # Logins Twitch (ce qu'il y a après twitch.tv/). Vérifie-les : le journal
  # affiche "introuvable" pour un login qui n'existe pas.
  streamers:
    - jltomy
    - michou
    - anyme023
    - squeezie
    - itachie        # à vérifier
    # Autres streamers FR qui jouent souvent à GTA (logins à vérifier dans le journal)
    - gotaga
    - inoxtag
    - zerator
    - ponce
    - rivenzi
    - domingo
  # Streamers à ne JAMAIS utiliser (ex. : quelqu'un qui a demandé un retrait)
  exclus: []
  # Ne garder que les clips joués sur GTA VI (sinon tout le contenu des streamers)
  seulement_gta6: true
  # Prendre aussi les meilleurs clips FR de toute la catégorie GTA VI
  categorie_gta6_fr: true
  langue: fr
  fenetre_heures: 48        # ne cherche que les clips des dernières 48 h
  vues_minimum: 50
  max_par_passage: 6        # clips téléchargés à chaque passage
  intervalle_minutes: 60    # fréquence de recherche

# --- Agent Montage ---
montage:
  # Claude choisit lui-même le format (solo, top, série en plusieurs parties)
  # et la durée de chaque vidéo, entre ces deux bornes.
  duree_min_s: 15
  duree_max_s: 180
  plan_min_clips: 3   # nombre de clips en attente avant de demander un plan à Claude
  modele_whisper: small     # tiny / base / small / medium (plus gros = plus précis, plus lent)
  sous_titres: true
  # Streamers qui ont déjà leurs propres sous-titres dans le stream : on n'ajoute pas les nôtres
  streamers_sans_sous_titres: [anyme023]
  # Format « top » : intro, puis #3, #2, #1 annoncés par une voix-off avant chaque clip
  voix_off: true
  voix_modele: fr_FR-siwis-medium   # voix française gratuite (Piper)
  credit: true              # "@streamer sur Twitch" affiché en permanence

# --- Agent TikTok ---
tiktok:
  # "brouillon" : la vidéo arrive dans ta boîte TikTok, tu appuies sur Publier.
  # "direct"    : publication 100 % automatique (exige l'audit de ton app TikTok).
  mode: brouillon
  # Tant que l'app n'est pas auditée, TikTok force la visibilité privée.
  visibilite: PUBLIC_TO_EVERYONE
  # Une vidéo toutes les 2 h (heure de Paris)
  horaires: ["12:00", "14:00", "16:00", "18:00", "20:00", "22:00"]
  hashtags_fixes: ["#gta6", "#gtavi", "#gta"]
  modele_ia: claude-opus-5-5
